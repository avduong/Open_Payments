version: 2

models:
  - name: open_payments_analytical_mart
    description: >
      Analytical mart at the payment-record grain, with one row per record_id.
    columns:
      - name: payment_month
        description: "Derived field from payment_date"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 1 and 12"

      - name: is_dental_sector
        description: "Derived boolean flag via array mapping."
        tests:
          - not_null

  - name: mart_payment_aggregates
    description: >
      Answers questions about structural cycles, seasonality, and how payment attributes differ.

  - name: mart_manufacturer_shares
    description: >
      Answers which manufacturers hold the highest market share.
    columns:
      - name: manufacturer_gpo_name
        description: "The name of manufacturer or Group Purchasing Organization (GPO)."

  - name: mart_provider_incentives
    description: >
      Provides the foundational dataset for the interactive behavioral calculator.
    columns:
      - name: recipient_profile_id
        description: "The primary key of this mart representing a unique provider."
    columns: 
      - name: in_kind_ratio
      - description: >
          Because the Open Payments dataset does not provide a single field categorizing payments 
          as “cash compensation” versus “benefits-in-kind,” for the purposes of this analysis, 
          payment nature categories were grouped into analytical classifications. 
          Travel and Lodging, Food and Beverage, Gift, and Entertainment were classified as benefits-in-kind, 
          while Consulting Fee, Honoraria, Compensation for services other than consulting, and Speaker Fee 
          were classified as direct cash compensation. These groupings are analytical definitions used for 
          comparison and do not represent an official CMS classification.
      