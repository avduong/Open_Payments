version: 2

models:
  - name: open_payments_analytical_mart
    description: >
      Analytical mart at the payment-record grain, with one row per record_id.
    columns:
      - name: payment_month
        description: "Derived field from payment_date"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 1 and 12"

      - name: is_dental_sector
        description: "Derived boolean flag via array mapping."
        tests:
          - not_null

  - name: mart_seasonal_payments
    description: >
      Answers questions about structural cycles, seasonality, and how payment attributes differ.

  - name: mart_manufacturer_shares
    description: >
      Answers which manufacturers hold the highest market share.
    columns:
      - name: manufacturer_gpo_name
        description: "The name of manufacturer or Group Purchasing Organization (GPO)."

  - name: mart_provider_incentives
    description: >
      Provides the foundational dataset for the interactive behavioral calculator.
    columns:
      - name: recipient_profile_id
        description: "The primary key of this mart representing a unique provider."
      